<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初中数学解题助手</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { max-width: 500px; width: 100%; background: white; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); padding: 25px 20px; }
        h1 { text-align: center; font-size: 22px; color: #1a202c; margin-top: 0; margin-bottom: 25px; }
        .input-area { background: #f7fafc; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .input-area label { font-weight: 600; font-size: 14px; color: #4a5568; display: block; margin-bottom: 8px; }
        .input-area input[type="text"] { width: 100%; padding: 12px 15px; font-size: 16px; border: 1px solid #e2e8f0; border-radius: 10px; box-sizing: border-box; outline: none; }
        .input-area input[type="text"]:focus { border-color: #4299e1; box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15); }
        .upload-btn-wrapper { position: relative; overflow: hidden; display: inline-block; margin-top: 10px; }
        .upload-btn-wrapper input[type=file] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        .btn { display: inline-block; padding: 10px 20px; background: #4299e1; color: white; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; }
        .btn:hover { background: #3182ce; }
        .btn:disabled { background: #a0aec0; cursor: not-allowed; }
        .btn-green { background: #48bb78; }
        .btn-green:hover { background: #38a169; }
        .solution-area { background: #fffff0; border-left: 4px solid #ecc94b; border-radius: 8px; padding: 15px; margin-top: 20px; white-space: pre-wrap; word-break: break-word; line-height: 1.6; }
        .solution-area .placeholder { color: #a0aec0; }
        #imageStatus { font-size: 14px; color: #718096; margin-top: 5px; }
        .footer { text-align: center; font-size: 12px; color: #a0aec0; margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h1>📐 初中数学解题助手</h1>
    <div class="input-area">
        <label for="questionInput">1. 手动输入题目</label>
        <input type="text" id="questionInput" placeholder="例如：已知 x+y=5, xy=6，求 x²+y²">
        <label style="margin-top: 15px;">2. 或拍照/上传题目图片</label>
        <div class="upload-btn-wrapper">
            <button class="btn">📷 选择图片</button>
            <input type="file" id="imageInput" accept="image/*" capture="environment">
        </div>
        <div id="imageStatus"></div>
    </div>
    <button class="btn btn-green" id="solveBtn" style="width:100%; padding: 14px; font-size: 18px;">🚀 AI 开始解题</button>
    <div class="solution-area" id="solutionArea">
        <span class="placeholder">👆 输入题目或上传图片后，点击上方按钮</span>
    </div>
    <div class="footer">💡 由 DeepSeek API 提供支持</div>
</div>

<script>
    const questionInput = document.getElementById('questionInput');
    const imageInput = document.getElementById('imageInput');
    const imageStatus = document.getElementById('imageStatus');
    const solveBtn = document.getElementById('solveBtn');
    const solutionArea = document.getElementById('solutionArea');
    let uploadedImageText = '';

    imageInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        imageStatus.textContent = '⏳ 正在识别图片中的文字...';
        recognizeText(file);
    });

    function recognizeText(file) {
        if (typeof Tesseract === 'undefined') {
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
            script.onload = () => performOCR(file);
            document.head.appendChild(script);
        } else {
            performOCR(file);
        }
    }

    function performOCR(file) {
        Tesseract.recognize(file, 'chi_sim+eng', { logger: m => console.log(m) })
            .then(({ data: { text } }) => {
                uploadedImageText = text.trim();
                if (uploadedImageText) {
                    imageStatus.textContent = '✅ 图片识别成功！已提取文字。';
                    questionInput.value = uploadedImageText;
                } else {
                    imageStatus.textContent = '⚠️ 未识别出文字，请手动输入。';
                }
            }).catch(err => {
                console.error(err);
                imageStatus.textContent = '❌ 图片识别失败，请手动输入。';
            });
    }

    solveBtn.addEventListener('click', function() {
        const question = questionInput.value.trim();
        if (question === '') {
            solutionArea.innerHTML = '⚠️ 请先输入题目或上传图片！';
            return;
        }
        solveBtn.disabled = true;
        solveBtn.textContent = '🤔 AI思考中...';
        solutionArea.innerHTML = '⏳ 正在生成解题步骤...';
        callDeepSeekAPI(question);
    });

    questionInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') solveBtn.click();
    });

    function callDeepSeekAPI(question) {
        fetch('/api/solve', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: question })
        })
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                solutionArea.innerHTML = `❌ 出错啦：${data.error}`;
            } else {
                let cleanAnswer = data.answer
                    .replace(/\\\[\s*\\forall\s*\\\]/g, '')
                    .replace(/\\forall/g, '')
                    .replace(/\\times\s*\\text\{times\}/g, '\\times')
                    .replace(/\\text\{neq\}/g, '\\neq')
                    .replace(/\\boxed\{([^}]*)\}/g, '$1')
                    .replace(/\\operatorname\{([^}]*)\}/g, '$1')
                    .replace(/\\mathrm\{([^}]*)\}/g, '$1')
                    .replace(/\\text\{([^}]*)\}/g, '$1');
                solutionArea.innerHTML = cleanAnswer.replace(/\n/g, '<br>');
                if (typeof renderMathInElement === 'function') {
                    renderMathInElement(solutionArea, {
                        delimiters: [
                            {left: '\\[', right: '\\]', display: true},
                            {left: '\\(', right: '\\)', display: false}
                        ]
                    });
                }
            }
        })
        .catch(error => {
            console.error('请求失败:', error);
            solutionArea.innerHTML = '❌ 网络请求失败，请稍后重试';
        })
        .finally(() => {
            solveBtn.disabled = false;
            solveBtn.textContent = '🚀 AI 开始解题';
        });
    }
</script>
</body>
</html>
